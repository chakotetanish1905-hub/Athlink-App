# Builds the app, runs the JVM unit tests, and runs the Firestore/Storage security-rules tests
# against the Firebase emulators. Uses a DUMMY google-services.json (CI only; the real one is
# never committed).
name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dummy google-services.json (CI only)
        run: cp .github/ci/google-services.json app/google-services.json
      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  rules:
    name: Security rules tests (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin policy tests
        working-directory: tools/admin
        run: npm ci && npm test
      - name: Rules tests
        working-directory: tests/rules
        shell: bash
        run: |
          npm ci
          npm run emulators:test 2>&1 | tee rules-output.txt
          exit ${PIPESTATUS[0]}
      - name: Report rules failures as an annotation
        if: failure()
        working-directory: tests/rules
        shell: bash
        run: |
          [ -f rules-output.txt ] || exit 0
          msg=$(grep -vE '^\s+at |^\s*$' rules-output.txt | tail -200 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Rules test output::${msg}"
