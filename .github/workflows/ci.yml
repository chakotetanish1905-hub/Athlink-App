# Builds the app, runs the JVM unit tests, and runs the Firestore/Storage security-rules tests
# against the Firebase emulators. Uses a DUMMY google-services.json (CI only; the real one is
# never committed).
name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Dummy google-services.json (CI only)
        run: cp .github/ci/google-services.json app/google-services.json
      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee gradle-output.txt
          exit ${PIPESTATUS[0]}
      - name: Assemble debug APK
        shell: bash
        run: |
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a gradle-output.txt
          exit ${PIPESTATUS[0]}
      - name: Report build failures as an annotation
        if: failure()
        shell: bash
        run: |
          [ -f gradle-output.txt ] || exit 0
          # Kotlin compiler errors ("e: file://...") and failed tests, trimmed to fit one annotation.
          summary=$( (grep -E '^e: |FAILED|Unresolved|> Task .* FAILED|What went wrong' -A3 gradle-output.txt | grep -v '^--$' | sed 's#file:///home/runner/work/[^/]*/[^/]*/##') | cut -c1-300 | head -120)
          msg=$(printf '%s' "$summary" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Gradle build output::${msg}"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  rules:
    name: Security rules tests (emulators)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Admin policy tests
        working-directory: tools/admin
        run: npm ci && npm test
      - name: Rules tests
        working-directory: tests/rules
        shell: bash
        run: |
          npm ci
          npm run emulators:test 2>&1 | tee rules-output.txt
          exit ${PIPESTATUS[0]}
      - name: Report rules failures as an annotation
        if: failure()
        working-directory: tests/rules
        shell: bash
        run: |
          [ -f rules-output.txt ] || exit 0
          # Only failing tests (+ their error lines) and the summary, to fit in one annotation.
          summary=$( (grep -A 14 '^not ok' rules-output.txt | grep -vE '^\s+at |^\s*$|duration_ms|type: |^\s+\.\.\.$|^--$'; grep -E '^# (tests|pass|fail)' rules-output.txt; grep -iE 'error:|exception' rules-output.txt | grep -v PERMISSION_DENIED | head -20) | cut -c1-400 | head -250)
          msg=$(printf '%s' "$summary" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Rules test output::${msg}"
